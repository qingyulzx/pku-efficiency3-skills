<title>原位电化学 LCTEM 成像</title>
<desc>source quote: Operando/in-situ liquid cell transmission electron microscopy (LCTEM) allows for real time imaging of dynamic nanoscale liquid-based processes.</desc>
<rect x="413.2" y="76.0" width="250.0" height="95.5" rx="8.0" fill="#eaf2fb" stroke="#1a1a1a" stroke-width="1.60"/>
</g>
<g id="S2" data-id="S2" data-kind="step" data-source-loc="Abstract 第5句">
<title>冷冻固定（cryogenic freezing）</title>
<desc>source quote: Using cryogenic inert gas transfer suitcase and a cryogenic plasma-focused ion beam (PFIB), a MEMs nanochip containing a Li electrolyte from an electrochemistry LCTEM holder was successfully frozen, transferred to the cryo stage of a PFIB and prepared into APT needle samples containing the electrolyte-electrode interface at cryogenic temperatures, followed by cryogenic transfer to an atom probe for nanoscale compositional analysis.</desc>
<rect x="783.2" y="76.0" width="250.0" height="95.5" rx="8.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.60"/>
</g>
